name: tiktok-live-simulator

services:
  api:
    extends:
      file: compose.build.yaml
      service: api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}
      MISTRAL_API_BASE_URL: ${MISTRAL_API_BASE_URL:?MISTRAL_API_BASE_URL is required}
      MISTRAL_CONTEXT_MODEL: ${MISTRAL_CONTEXT_MODEL:?MISTRAL_CONTEXT_MODEL is required}
      MISTRAL_COMMENT_MODEL: ${MISTRAL_COMMENT_MODEL:?MISTRAL_COMMENT_MODEL is required}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?DEEPGRAM_API_KEY is required}
      DEEPGRAM_STREAMING_BASE_URL: ${DEEPGRAM_STREAMING_BASE_URL:?DEEPGRAM_STREAMING_BASE_URL is required}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:?DEEPGRAM_MODEL is required}
      DEEPGRAM_LANGUAGE_HINT: ${DEEPGRAM_LANGUAGE_HINT:?DEEPGRAM_LANGUAGE_HINT is required}
      DEEPGRAM_EOT_THRESHOLD: ${DEEPGRAM_EOT_THRESHOLD:?DEEPGRAM_EOT_THRESHOLD is required}
      DEEPGRAM_EOT_TIMEOUT_MS: ${DEEPGRAM_EOT_TIMEOUT_MS:?DEEPGRAM_EOT_TIMEOUT_MS is required}
    expose:
      - '3000'
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    extends:
      file: compose.build.yaml
      service: app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:18080:8080'
    networks:
      - edge
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  edge:
  egress:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
